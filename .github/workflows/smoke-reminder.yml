name: WeCom Smoke Reminder

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Send smoke reminder to WeCom
        run: |
          echo "开始发送企业微信消息"
          curl -sS '${{ secrets.WECOM_WEBHOOK }}' \
            -H 'Content-Type: application/json' \
            -d '{
              "msgtype": "text",
              "text": {
                "content": "温馨提示，到点了该抽烟了！"
              }
            }'
          echo ""
          echo "发送结束"
