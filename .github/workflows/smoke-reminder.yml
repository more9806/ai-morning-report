name: WeCom Smoke Reminder

on:
  workflow_dispatch:
  schedule:
    # 北京时间周一到周五 10:07-17:07
    # GitHub 用 UTC，所以这里是 UTC 02:07-09:07
    - cron: '7 2-9 * * 1-5'

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Show trigger type
        run: |
          echo "当前触发方式是：${{ github.event_name }}"

      - name: Send smoke reminder to WeCom
        run: |
          echo "开始发送企业微信消息"
          curl -sS '${{ secrets.WECOM_WEBHOOK }}' \
            -H 'Content-Type: application/json' \
            -d '{
              "msgtype": "text",
              "text": {
                "content": "温馨提示，到点了该抽烟了！"
              }
            }'
          echo ""
          echo "发送结束"
