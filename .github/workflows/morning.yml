name: Daily AI Morning Report

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install openai requests

      - name: Send morning report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WEWORK_WEBHOOK: ${{ secrets.WEWORK_WEBHOOK }}
        run: python morning_report.py
